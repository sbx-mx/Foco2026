<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#006241">
  <title>FOCO 2026</title>
  <link rel="manifest" href="manifest.webmanifest?v=8.1.0">
  <link rel="icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="stylesheet" href="style.css?v=9.0.0">
</head>
<body>
  <a class="skipLink" href="#content">Ir al contenido</a>
  <div class="appShell">
      <nav class="executiveNav" aria-label="Navegación principal">
        <a class="navBrand" href="#rd" aria-label="FOCO 2026 · Inicio">
          <span class="mark"><img src="assets/icons/icon-96.png" alt=""></span>
          <span class="appTitle"><strong>FOCO 2026</strong><small>Executive Dashboard</small></span>
        </a>
        <div class="tabs" role="tablist" aria-label="Vistas FOCO">
          <button class="tab active" data-view="rd" type="button" role="tab" aria-selected="true"><span>RD</span><small>Región</small></button>
          <button class="tab" data-view="dm" type="button" role="tab" aria-selected="false"><span>DM</span><small>Distrito</small></button>
          <button class="tab" data-view="tienda" type="button" role="tab" aria-selected="false"><span>Tienda</span><small>Detalle</small></button>
        </div>
        <div class="navStatus"><span class="statusDot" aria-hidden="true"></span><span id="dataStatus">Validando datos…</span></div>
      </nav>
    <div class="workspace">
      <header class="appTop">
        <div>
          <span class="eyebrow">FOCO · Operaciones</span>
          <h2 id="pageTitle">Vista ejecutiva RD</h2>
          <p id="appSubtitle">Dashboard ejecutivo Starbucks</p>
        </div>
        <button id="exportBtn" class="exportBtn" type="button" aria-label="Exportar vista actual a PDF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg>
          <span class="exportLabel">Exportar PDF</span>
        </button>
      </header>

      <main class="wrap">
        <section id="filters" class="filters rd" aria-label="Filtros del dashboard">
          <div class="filterHeading">
            <div>
              <span class="eyebrow">Segmentadores</span>
              <h3>Filtros activos</h3>
            </div>
            <span class="liveBadge"><span></span>Actualización inmediata</span>
          </div>
          <div class="filterGrid">
            <div class="field">
              <label for="mes">Mes</label>
              <select id="mes"></select>
            </div>
            <div class="field" id="regionWrap">
              <label for="region">RD / Región</label>
              <select id="region" data-slicer="RD / Región"></select>
            </div>
            <div class="field hide" id="dmWrap">
              <label for="dm">DM</label>
              <select id="dm" data-slicer="DM"></select>
            </div>
            <div class="field hide" id="storeWrap">
              <label for="store">Tienda</label>
              <select id="store" data-slicer="Tienda"></select>
            </div>
          </div>
        </section>

        <section id="context" class="contextLine" aria-live="polite"></section>
        <section id="printHeader" class="printHeader"></section>
        <section id="content" class="view" tabindex="-1"></section>
      </main>
      <footer class="executiveFooter">
        <span>Diseñado: Jorge Alcantar Aguiar &amp; Enrique César Flores</span>
        <a href="https://wa.me/message/ENKDSAHYHIGAN1" target="_blank" rel="noopener noreferrer">Comentarios y/o Sugerencias</a>
      </footer>
    </div>
  </div>

  <script src="data.js?v=8.1.0"></script>
  <script src="slicers.js?v=8.1.0"></script>
  <script src="app.js?v=9.0.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js?v=8.1.0'));
    }
  </script>
</body>
</html>
